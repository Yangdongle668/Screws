name: Validate ZUFEK website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm run install:ci
      - name: Generate content
        run: node scripts/generate-site.mjs
      - name: Verify content and links
        run: |
          node scripts/verify-content.mjs
          node scripts/verify-multilingual.mjs
          node scripts/verify-language-preference.mjs
          node scripts/verify-images.mjs
          node scripts/verify-priorities.mjs
          node scripts/audit-topology.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
  smtp-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: smtp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smtp-bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n deploy.sh update.sh backup.sh docker/common.sh
      - name: Test update failure and backup ordering
        run: bash docker/verify-update.sh
      - name: Validate Compose configuration
        env:
          PUBLIC_URL: https://docker-ci.example.invalid
          SITE_HOST: docker-ci.example.invalid
          TLS_EMAIL: qa@example.invalid
        run: |
          printf '%s\n' '# Disposable Compose validation only; no secrets' > .env.docker
          docker compose --env-file /dev/null config --quiet --no-env-resolution
      - name: Build independent deployment image
        run: docker build --build-arg PUBLIC_URL=https://docker-ci.example.invalid -t zufek-ci:${{ github.sha }} .
      - name: Test production container without external services
        run: docker run --rm --entrypoint node zufek-ci:${{ github.sha }} docker/verify-runtime.mjs
