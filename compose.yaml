name: zufek
services:
  app:
    image: zufek-website:${APP_VERSION:-local}
    build:
      context: .
      args:
        PUBLIC_URL: ${PUBLIC_URL:-}
    restart: unless-stopped
    init: true
    env_file: .env.docker
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-1573}:3000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
