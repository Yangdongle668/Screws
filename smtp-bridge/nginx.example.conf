# Replace the example name and certificate paths with your own HTTPS domain.
server {
    listen 443 ssl;
    server_name smtp-api.example.com;
    ssl_certificate /etc/letsencrypt/live/smtp-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smtp-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80k;
    location ~ ^/(send|diagnose)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }
    location / { return 404; }
}
